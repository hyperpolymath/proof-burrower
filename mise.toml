#
# The toolchain for proof-burrower. Specs are `latest`; mise.lock records the
# concrete version and per-platform checksum of each, so every checkout
# installs the same bits (PROVISIONING-STANDARD §4).
#
# Rust is not a mise tool here: rust-toolchain.toml pins it through rustup
# (stable + wasm32-unknown-unknown for burrower-wasm).
# Idris2 is not a mise tool: it comes from pack (src/interface/abi ABI).
# Julia is only needed for the optional tropical-types pre-proof oracle.
# Estate policy: no python, deno, node/npm/yarn, go, java or make here.

[settings]
lockfile = true

[tools]
just = "latest"
shellcheck = "latest"
zig = "latest"
julia = "latest"
