# This workflow is managed by gh actions-lock.
name: Proof Safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: proof-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isabelle:
    name: Burrower proof safety
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperpolymath/echidna
          ref: 556d64687a8872026c81e4689ac3d574c7acc6ce
          path: _echidna
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            . -> target
            _echidna -> target
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto pkg-config libssl-dev
      - name: Install checksum-verified Isabelle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Official release mirrors; both must match the same pinned archive.
          # A mirror outage is retried with bounded connection/download times.
          curl --fail --location --connect-timeout 20 --max-time 600 --retry 2 --retry-max-time 660 \
            -o isabelle.tar.gz https://isabelle.in.tum.de/website-Isabelle2025-2/dist/Isabelle2025-2_linux.tar.gz || \
          curl --fail --location --connect-timeout 20 --max-time 600 --retry 2 --retry-max-time 660 \
            -o isabelle.tar.gz https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/Isabelle2025-2_linux.tar.gz
          echo 'a20a507bc7c1270d8be96a9f3fbec06345387789d2dc2c4d3df6260d47bfb33c  isabelle.tar.gz' | sha256sum --check --strict
          tar -xzf isabelle.tar.gz
          echo "$RUNNER_TEMP/Isabelle2025-2/bin" >> "$GITHUB_PATH"
          echo "USER_HOME=$RUNNER_TEMP/isabelle-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/isabelle-user/.isabelle/Isabelle2025-2/etc"
          cat > "$RUNNER_TEMP/isabelle-user/.isabelle/Isabelle2025-2/etc/settings" <<'SETTINGS'
          ISABELLE_TOOL_JAVA_OPTIONS="-Djava.awt.headless=true -Xms256m -Xmx1536m -Xss16m"
          ML_OPTIONS="--minheap 256 --maxheap 2048"
          SETTINGS
      - name: Build ECHIDNA and run Burrower unit tests
        run: |
          cargo build --locked --manifest-path _echidna/Cargo.toml --bin echidna
          cargo test --locked --workspace
      - name: Require real accepted and rejected Isabelle goals
        env:
          ECHIDNA_BIN: ${{ github.workspace }}/_echidna/target/debug/echidna
        run: |
          bash tests/e2e.sh
  agda:
    name: Agda proofs (PROOF-POLICY §2.1 canonical invocation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned, digest-checked Agda and standard library
        run: |
          set -euo pipefail
          tc="$RUNNER_TEMP/agda"
          mkdir -p "$tc"
          curl --fail --location --retry 3 -o "$tc/agda.tar.xz" \
            https://github.com/agda/agda/releases/download/v2.7.0.1/Agda-v2.7.0.1-linux.tar.xz
          echo "975b515a14877ab6bce5bfc641e16c4a3ee52ca5d7f846577dee80aa2145db8a  $tc/agda.tar.xz" | sha256sum --check
          curl --fail --location --retry 3 -o "$tc/stdlib.tar.gz" \
            https://github.com/agda/agda-stdlib/archive/refs/tags/v2.1.tar.gz
          echo "72ca3ea25094efa0439e106f0d949330414232ec4cc5c3c3316e7e70dd06d431  $tc/stdlib.tar.gz" | sha256sum --check
          tar --no-same-owner -xJf "$tc/agda.tar.xz" -C "$tc"
          tar --no-same-owner -xzf "$tc/stdlib.tar.gz" -C "$tc"
          printf '%s\n' "$tc/agda-stdlib-2.1/standard-library.agda-lib" \
            "$GITHUB_WORKSPACE/verification/proofs/agda/burrow.agda-lib" > "$tc/libraries"
          {
            echo "Agda_datadir=$tc/Agda-v2.7.0.1/data"
            echo "AGDA_LIBRARIES_FILE=$tc/libraries"
            echo "LC_ALL=C.UTF-8"
          } >> "$GITHUB_ENV"
          echo "$tc/Agda-v2.7.0.1/bin" >> "$GITHUB_PATH"
      - name: Type-check DOM-1 and DOM-2 and print the receipt
        working-directory: verification/proofs/agda
        run: |
          set -euo pipefail
          agda --version
          echo "commit: $GITHUB_SHA"
          echo "flags: --safe --without-K --cubical-compatible"
          echo "import cone (first-party):"
          sha256sum Burrow/Trust.agda Burrow/Ledger.agda burrow.agda-lib
          find . -name '*.agdai' -delete
          for m in Burrow/Trust.agda Burrow/Ledger.agda; do
            agda --no-default-libraries --library-file "$AGDA_LIBRARIES_FILE" \
              --safe --without-K --cubical-compatible "$m"
          done
