name: Proof Safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: proof-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isabelle:
    name: Burrower proof safety
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperpolymath/echidna
          ref: 556d64687a8872026c81e4689ac3d574c7acc6ce
          path: _echidna
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            . -> target
            _echidna -> target
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto pkg-config libssl-dev
      - name: Install checksum-verified Isabelle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Official release mirrors; both must match the same pinned archive.
          # A mirror outage is retried with bounded connection/download times.
          curl --fail --location --connect-timeout 20 --max-time 600 --retry 2 --retry-max-time 660 \
            -o isabelle.tar.gz https://isabelle.in.tum.de/website-Isabelle2025-2/dist/Isabelle2025-2_linux.tar.gz || \
          curl --fail --location --connect-timeout 20 --max-time 600 --retry 2 --retry-max-time 660 \
            -o isabelle.tar.gz https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist/Isabelle2025-2_linux.tar.gz
          echo 'a20a507bc7c1270d8be96a9f3fbec06345387789d2dc2c4d3df6260d47bfb33c  isabelle.tar.gz' | sha256sum --check --strict
          tar -xzf isabelle.tar.gz
          echo "$RUNNER_TEMP/Isabelle2025-2/bin" >> "$GITHUB_PATH"
          echo "USER_HOME=$RUNNER_TEMP/isabelle-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/isabelle-user/.isabelle/Isabelle2025-2/etc"
          cat > "$RUNNER_TEMP/isabelle-user/.isabelle/Isabelle2025-2/etc/settings" <<'SETTINGS'
          ISABELLE_TOOL_JAVA_OPTIONS="-Djava.awt.headless=true -Xms256m -Xmx1536m -Xss16m"
          ML_OPTIONS="--minheap 256 --maxheap 2048"
          SETTINGS
      - name: Build ECHIDNA and run Burrower unit tests
        run: |
          cargo build --locked --manifest-path _echidna/Cargo.toml --bin echidna
          cargo test --locked --workspace
      - name: Require real accepted and rejected Isabelle goals
        env:
          ECHIDNA_BIN: ${{ github.workspace }}/_echidna/target/debug/echidna
        run: |
          bash tests/e2e.sh
  agda:
    # DOM-1/DOM-2 (Agda theory). The check-run name agda-proofs is the
    # contract echidna's W0 gate (check 12) reads. PROOF-POLICY §2.1 invocation with the
    # pinned Agda 2.7.0.1 and agda-stdlib 2.1 (digests in setup-agda.sh),
    # then the §8.2 cone receipt each theorem's PWG is derived from. A
    # missing or wrong toolchain fails the job; it never skips.
    name: agda-proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Agda and standard library
        run: bash scripts/ci/setup-agda.sh
      - name: Type-check under the §2.1 invocation (through the wrapper)
        run: |
          set -euo pipefail
          stdlib_src="$(dirname "$(head -n 1 "$AGDA_LIBRARIES_FILE")")/src"
          AGDA_LIBRARY_INCLUDE="$stdlib_src" bash scripts/agda-safe-check.sh \
            verification/proofs/agda/Burrow/Trust.agda verification/proofs/agda/Burrow/Ledger.agda
      - name: Record the §8.2 cone receipts
        env:
          AGDA_STDLIB_SHA256: 72ca3ea25094efa0439e106f0d949330414232ec4cc5c3c3316e7e70dd06d431
        run: |
          set -euo pipefail
          bash scripts/ci/test-agda-cone-receipt.sh
          receipts="$RUNNER_TEMP/agda-cone-receipts.jsonl"
          : > "$receipts"
          for m in Burrow/Trust.agda Burrow/Ledger.agda; do
            (cd verification/proofs/agda && bash ../../../scripts/ci/agda-cone-receipt.sh "$m") >> "$receipts"
          done
          cat "$receipts"
          {
            echo '## PROOF-POLICY §8.2 cone receipts (DOM-1, DOM-2)'
            jq -r '"\(.source.entrypoint) at \(.source.commit): \(.toolchain.agda), \(.import_cone.count) modules, scan \(.postulate_scan.result)"' "$receipts"
          } >> "$GITHUB_STEP_SUMMARY"
