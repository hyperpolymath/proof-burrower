# SPDX-License-Identifier: MPL-2.0
# ONE-OFF, scratch branch only, deleted after use. Regenerates main's
# actions.lock with the estate repair order (regen_lock in
# standards/scripts/regen-dependabot-locks.sh), runs the governance gate's own
# check against the result, and prints the lock base64-encoded. It has no
# `uses:` steps, so it needs no lock entry to start. It writes nothing back:
# the lock reaches the repository in a reviewed PR.
name: one-off actions.lock regeneration
on:
  push:
    branches: [claude/new-session-th4e9w-wo10-lockregen]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STANDARDS_REGEN_SHA: e064539116c2dcfdf282a4749dbd58c69961c7e6
      STANDARDS_GATE_SHA: 857ff096af11451841fb10488fed1438523973a1
    steps:
      - name: Regenerate main's actions.lock and check it with the gate
        run: |
          set -uo pipefail
          git clone --quiet --branch claude/new-session-th4e9w-wo10-k9 "https://github.com/$REPO.git" pb
          git -C pb log --oneline -1
          git clone --quiet https://github.com/hyperpolymath/standards.git std
          git -C std worktree add --quiet --detach ../std-regen "$STANDARDS_REGEN_SHA"
          git -C std worktree add --quiet --detach ../std-gate "$STANDARDS_GATE_SHA"
          sudo apt-get install -y -qq gawk >/dev/null
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --version
          export GH_BIN=gh REGEN_TOOLS="$PWD/std-regen/scripts"
          source std-regen/scripts/regen-dependabot-locks.sh
          outcome="$(regen_lock "$PWD/pb")"
          echo "OUTCOME=$outcome"
          git -C pb status --porcelain
          echo "== the governance gate, as pinned by proof-burrower ($STANDARDS_GATE_SHA)"
          (cd pb && ACTIONS_LOCK_VERIFIER="$PWD/../std-gate/scripts/update-actions-lock.sh" \
            bash ../std-gate/scripts/check-actions-lock-gate.sh .github/workflows); echo "GATE_RC=$?"
          echo "LOCK-SHA256 $(sha256sum < pb/.github/workflows/actions.lock | cut -d' ' -f1)"
          echo "LOCK-BEGIN"
          base64 -w0 pb/.github/workflows/actions.lock; echo
          echo "LOCK-END"
          # Hand the tool-written lock back on a scratch branch (never merged):
          # the session copies the file into its PR branch with git.
          cd pb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B claude/new-session-th4e9w-wo10-lockout
          git add .github/workflows/actions.lock
          git commit -q -m "scratch: regenerated actions.lock (not for merge)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" HEAD:claude/new-session-th4e9w-wo10-lockout
